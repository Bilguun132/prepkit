name: Deploy Prepkit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html app.js styles.css content.json topics.json _site/
          printf '{"lastUpdated":"%s"}\n' "$(git log -1 --format=%cI)" > _site/build-info.json
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
      - name: Wait for uploaded artifact to be discoverable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          name = os.environ['PAGES_ARTIFACT_NAME']
          query = urllib.parse.urlencode({'name': name, 'per_page': 100})
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?{query}")
          for attempt in range(12):
              request = urllib.request.Request(url, headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      artifacts = json.load(response)['artifacts']
                  matches = [a for a in artifacts if a['name'] == name and not a['expired']]
                  if len(matches) == 1:
                      print(f'Artifact ready: {name}')
                      break
                  if len(matches) > 1:
                      raise SystemExit(f'Duplicate artifacts for {name}')
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
              if attempt == 11:
                  raise SystemExit(f'Artifact did not become discoverable: {name}')
              print(f'Waiting for artifact visibility ({attempt + 1}/12)')
              time.sleep(5)
          PY
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
